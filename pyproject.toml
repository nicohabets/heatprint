[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heatprint-core"
version = "0.1.0"
description = "Weather-corrected heating analytics for any mix of gas, heat pump, electric and district heat. Pure-Python core used by the Heatprint Home Assistant integration."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nico Habets" }]
keywords = ["degree-days", "graaddagen", "energy-signature", "heat-pump", "home-assistant", "knmi", "pbl", "prism"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
]
# The core deliberately has NO hard runtime dependencies (see docs/adr/0002).
dependencies = []

[project.optional-dependencies]
http = ["aiohttp>=3.9"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/nicohabets/heatprint"
Issues = "https://github.com/nicohabets/heatprint/issues"

[tool.setuptools.packages.find]
include = ["heatprint_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
